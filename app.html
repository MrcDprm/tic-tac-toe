<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- seo -->
    <!-- Sunucu fonksiyonu (api/page.js) bu bölümü her adres için başlık, açıklama ve yapılandırılmış veriyle doldurur -->
    <title>Tic-Tac-Toe · Miraç Deprem</title>
    <meta name="robots" content="noindex" />
    <!-- /seo -->
    <meta name="theme-color" content="#f8fafc" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/src/theme-init.js"></script>
    <script type="module" src="/src/main.js"></script>
    <script defer src="https://nabiz.miracdeprem.com/js/nabiz.js" data-site="tictactoe.miracdeprem.com"></script>
  </head>
  <body>
    <svg class="svg-defs" aria-hidden="true">
      <!-- Tebeşir dokusu: çizginin kenarını bozar, içinde küçük boşluklar açar -->
      <filter id="chalk" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" result="rough" />
        <feComponentTransfer in="noise" result="gaps">
          <feFuncA type="discrete" tableValues="1 1 1 1 0 1 1" />
        </feComponentTransfer>
        <feComposite in="rough" in2="gaps" operator="in" />
      </filter>
    </svg>

    <header class="topbar">
      <div class="intro">
        <h1>Tic-Tac-Toe</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
      <div class="topbar-actions">
        <div class="lang-switch" role="group" data-i18n-aria="language">
          <button type="button" data-lang="tr">TR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button type="button" class="theme-button" id="theme-toggle"></button>
      </div>
    </header>

    <main class="page">
      <div class="game">
        <form class="settings" id="settings">
          <fieldset class="segmented">
            <legend data-i18n="board"></legend>
            <label><input type="radio" name="size" value="3" /><span>3×3</span></label>
            <label><input type="radio" name="size" value="4" /><span>4×4</span></label>
            <label><input type="radio" name="size" value="5" /><span>5×5</span></label>
          </fieldset>
          <fieldset class="segmented">
            <legend data-i18n="opponent"></legend>
            <label><input type="radio" name="opponent" value="computer" /><span data-i18n="computer"></span></label>
            <label><input type="radio" name="opponent" value="human" /><span data-i18n="twoPlayers"></span></label>
          </fieldset>
          <fieldset class="segmented" id="level-group">
            <legend data-i18n="level"></legend>
            <label><input type="radio" name="level" value="easy" /><span data-i18n="easy"></span></label>
            <label><input type="radio" name="level" value="medium" /><span data-i18n="medium"></span></label>
            <label><input type="radio" name="level" value="hard" /><span data-i18n="hard"></span></label>
          </fieldset>
        </form>

        <p class="rules" id="rules"></p>

        <section class="scoreboard" aria-live="off">
          <div class="score-card" data-player="X">
            <div class="score-head mark-x"><span class="score-name" id="name-x"></span></div>
            <div class="score-tally-row mark-x">
              <svg class="tally" id="tally-x" aria-hidden="true"></svg>
              <strong class="score-value" id="series-x">0</strong>
            </div>
            <span class="score-points" id="points-x"></span>
          </div>
          <div class="score-card" data-player="O">
            <div class="score-head mark-o"><span class="score-name" id="name-o"></span></div>
            <div class="score-tally-row mark-o">
              <svg class="tally" id="tally-o" aria-hidden="true"></svg>
              <strong class="score-value" id="series-o">0</strong>
            </div>
            <span class="score-points" id="points-o"></span>
          </div>
          <div class="score-card score-draws">
            <div class="score-head"><span class="score-name" data-i18n="draws"></span></div>
            <div class="score-tally-row">
              <svg class="tally" id="tally-draws" aria-hidden="true"></svg>
              <strong class="score-value" id="series-draws">0</strong>
            </div>
          </div>
        </section>

        <div class="board-wrap">
          <svg class="grid-lines" id="grid-lines" aria-hidden="true"></svg>
          <div class="board" id="board" role="group" data-i18n-aria="gameBoard"></div>
          <svg class="lines" id="lines" aria-hidden="true"></svg>
        </div>

        <p class="status" id="status" role="status"></p>

        <div class="actions">
          <button type="button" class="btn btn-primary" id="new-game" data-i18n="newGame"></button>
          <button type="button" class="btn btn-ghost" id="reset-score" data-i18n="resetScore"></button>
        </div>
      </div>
    </main>

    <dialog class="fb-dialog" id="fb-dialog" aria-labelledby="fb-title">
      <form class="fb-form" id="fb-form" novalidate>
        <h2 class="fb-title" id="fb-title" data-i18n="feedbackTitle"></h2>
        <p class="fb-intro" data-i18n="feedbackIntro"></p>
        <label class="fb-label" for="fb-name" data-i18n="feedbackName"></label>
        <input class="fb-input" id="fb-name" type="text" maxlength="100" autocomplete="name" />
        <label class="fb-label" for="fb-contact" data-i18n="feedbackContact"></label>
        <input class="fb-input" id="fb-contact" type="text" maxlength="255" autocomplete="email" required />
        <label class="fb-label" for="fb-message" data-i18n="feedbackMessage"></label>
        <textarea class="fb-input" id="fb-message" rows="4" maxlength="2000" required></textarea>
        <div class="fb-hp" aria-hidden="true">
          <label for="fb-website">Website</label>
          <input id="fb-website" type="text" tabindex="-1" autocomplete="off" />
        </div>
        <p class="fb-status" id="fb-status" role="status"></p>
        <div class="fb-actions">
          <button type="button" class="btn btn-ghost" id="fb-close" data-i18n="feedbackClose"></button>
          <button type="submit" class="btn btn-primary" id="fb-submit" data-i18n="feedbackSend"></button>
        </div>
      </form>
    </dialog>

    <footer class="footer">
      <button type="button" class="fb-open" id="fb-open">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" /></svg>
        <span data-i18n="feedback"></span>
      </button>
      <nav class="footer-projects" data-i18n-aria="jsProjects">
        <a href="https://www.miracdeprem.com/projects" data-i18n="otherProjects"></a>
      </nav>
      <div class="footer-meta">
        <span>© 2026 Miraç Deprem</span>
        <a href="https://www.miracdeprem.com" data-i18n="portfolio"></a>
        <a href="https://github.com/MrcDprm/tic-tac-toe" data-i18n="source"></a>
      </div>
    </footer>

    <noscript><p class="noscript">Bu oyun JavaScript gerektirir. · This game requires JavaScript.</p></noscript>
  </body>
</html>
